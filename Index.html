<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleTales Gamepad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --surface-color: #2a2a35;
            --accent-color: #e2b714;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --hp-color: #ff4757;
            --mp-color: #1e90ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            user-select: none;
        }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        /* Loading Screen */
        #loading { text-align: center; margin-top: 50px; color: var(--text-muted); }
        
        /* Status Header */
        .status-header {
            background: var(--surface-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-name { font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        .bar-container { background: #111; border-radius: 4px; height: 8px; margin-bottom: 8px; overflow: hidden; }
        .hp-fill { background: var(--hp-color); height: 100%; transition: width 0.3s; }
        .mp-fill { background: var(--mp-color); height: 100%; transition: width 0.3s; }
        .stat-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

        /* Action Buttons */
        .action-list { display: flex; flex-direction: column; gap: 12px; }
        .action-btn {
            background: var(--surface-color);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.1s, border-color 0.1s;
        }
        .action-btn:active { transform: scale(0.98); border-color: var(--accent-color); }
        .action-title { font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }
        .action-cost { color: var(--mp-color); font-size: 13px; }
        .action-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        
        /* Toast Notification */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 4px; padding: 12px;
            position: fixed; z-index: 1; left: 50%; bottom: 30px;
            transform: translateX(-50%); font-size: 14px;
        }
        #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.3s 2.7s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div id="loading">📡 Syncing with the Realm...</div>

    <div id="combat-ui" style="display: none;">
        <div class="status-header" id="status-header">
            <!-- Populated by JS -->
        </div>
        
        <h2>⚔️ Choose Action</h2>
        <div class="action-list" id="action-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <div id="toast">Action Locked In!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Forces the MiniApp to open to full/half height smoothly
        
        // --- REPLACE THIS WITH YOUR NEW GAS WEBHOOK URL ---
        const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxr9JHs-_hq2rBr85EoOj-6urlj6FONsLAKsBou3DY8WTblcXWIVloTbfc-AiHLn1hbNA/exec"; 

        document.addEventListener("DOMContentLoaded", () => {
            fetchCombatState();
        });

        function fetchCombatState() {
            // For testing in a normal browser, fallback to a dummy ID
            let userId = tg.initDataUnsafe?.user?.id || "123456789"; 
            
            fetch(GAS_WEBHOOK_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "get_combat_ui",
                    initData: tg.initData,
                    userId: userId
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('combat-ui').style.display = 'block';
                    renderHeader(data.character);
                    renderActions(data.skills, data.character);
                } else {
                    document.getElementById('loading').innerText = "⚠️ Not currently in combat.";
                }
            })
            .catch(err => {
                document.getElementById('loading').innerText = "Fetch failed. Please check connection.";
            });
        }

        function renderHeader(char) {
            const hpPct = Math.max(0, Math.min(100, (char.hp / char.maxHp) * 100));
            const mpPct = Math.max(0, Math.min(100, (char.mp / char.maxMp) * 100));
            
            const html = `
                <div class="status-name">${char.name} (Lv.${char.level} ${char.class})</div>
                <div class="bar-container"><div class="hp-fill" style="width: ${hpPct}%;"></div></div>
                <div class="stat-labels"><span>❤️ HP</span><span>${char.hp} / ${char.maxHp}</span></div>
                <div style="height:8px;"></div>
                <div class="bar-container"><div class="mp-fill" style="width: ${mpPct}%;"></div></div>
                <div class="stat-labels"><span>🔹 MP</span><span>${char.mp} / ${char.maxMp}</span></div>
            `;
            document.getElementById('status-header').innerHTML = html;
        }

        function renderActions(skills, char) {
            const list = document.getElementById('action-list');
            list.innerHTML = ""; // Clear existing

            // Always add a Basic Attack first
            const atkBtn = document.createElement('div');
            atkBtn.className = 'action-btn';
            atkBtn.innerHTML = `
                <div class="action-title"><span>🗡️ Basic Attack</span></div>
                <div class="action-desc">Deal physical damage to an enemy. Generates no threat.</div>
            `;
            atkBtn.onclick = () => submitAction("basic_attack");
            list.appendChild(atkBtn);

            // Render Class Skills
            skills.forEach(skill => {
                const btn = document.createElement('div');
                btn.className = 'action-btn';
                
                // Dim the button if not enough MP
                if (char.mp < skill.mpCost) {
                    btn.style.opacity = "0.5";
                    btn.style.pointerEvents = "none";
                }

                btn.innerHTML = `
                    <div class="action-title"><span>✨ ${skill.name}</span> <span class="action-cost">${skill.mpCost} MP</span></div>
                    <div class="action-desc">${skill.description}</div>
                `;
                btn.onclick = () => submitAction(skill.id);
                list.appendChild(btn);
            });
            
            // Flee / Items can be added here
        }

        function submitAction(skillId) {
            let userId = tg.initDataUnsafe?.user?.id || "123456789";
            
            // Show toast notification immediately for good UX
            const toast = document.getElementById("toast");
            toast.className = "show";
            
            // Tell the Telegram bot to vibrate the phone for haptic feedback!
            tg.HapticFeedback.impactOccurred('medium');

            fetch(GAS_WEBHOOK_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "submit_combat_action",
                    initData: tg.initData,
                    userId: userId,
                    skillId: skillId
                })
            })
            .then(() => {
                // Instantly close the MiniApp and drop the player back into the chat
                setTimeout(() => tg.close(), 800); 
            });
        }
    </script>
</body>
</html>
